name: ShopFlow CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shopflow_test
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: shopflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopflow -d shopflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        run: |
          PGPASSWORD=shopflow_password psql \
            -h localhost \
            -U shopflow \
            -d shopflow_test \
            -f ../postgres/init.sql

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build 
